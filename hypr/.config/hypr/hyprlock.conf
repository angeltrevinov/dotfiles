background {
    monitor =
    color = rgba(13, 15, 18, 1.0)
    blur_passes = 0
}

input-field {
    monitor =
    size = 280, 55
    outline_thickness = 3
    rounding = 12
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    inner_color = rgba(255, 255, 255, 0.05)
    font_color = rgb(230, 230, 230)
    fade_on_empty = true
    placeholder_text = <i><span foreground="##9aa0a6">Password...</span></i>
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 0.95)
    font_size = 88
    font_family = Noto Sans
    shadow_passes = 3
    position = 0, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %B %d')"
    color = rgba(255, 255, 255, 0.55)
    font_size = 22
    font_family = Noto Sans
    position = 0, -20
    halign = center
    valign = center
}